clone:
  - name: git
    image: woodpeckerci/plugin-git:2.8.1
    settings:
      object-format: sha256
      depth: 0

steps:
  - name: mirror-to-github
    image: alpine/git:latest
    environment:
      GITHUB_TOKEN:
        from_secret: github_pat
    commands:
      - git fetch --unshallow origin || true
      - git fetch origin --tags || true
      - git init --bare --object-format=sha1 /tmp/sha1-mirror
      - git fast-export --all | git -C /tmp/sha1-mirror fast-import
      - git -C /tmp/sha1-mirror remote add github https://x-access-token:$GITHUB_TOKEN@github.com/nushell-prophet/nu-multiproof.git
      - git -C /tmp/sha1-mirror push github --all --force
      - git -C /tmp/sha1-mirror push github --tags --force

when:
  - event: push
    branch: main
